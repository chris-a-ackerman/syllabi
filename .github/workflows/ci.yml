name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Build smoke: catches broken imports/exports Vite would only surface at build time
      - run: npm run build

  deno-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # matches backend/supabase/config.toml deno_version
      - run: deno task test:unit
        working-directory: backend/supabase

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          # 2.75 verified verify_jwt tokens as HS256 only and rejected the
          # ES256 tokens the local GoTrue issues; 2.116 verifies via JWKS.
          version: 2.116.0
      - name: Start Supabase stack (trimmed)
        run: supabase start -x studio,imgproxy,logflare,vector,realtime
        working-directory: backend
      - name: Serve edge functions
        run: |
          supabase/tests/contract/serve-env.sh > /tmp/contract.env
          supabase functions serve --env-file /tmp/contract.env &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 2 http://127.0.0.1:54321/functions/v1/chat || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
        working-directory: backend
      - name: Export local stack keys
        run: supabase status -o env | sed 's/"//g' | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=' >> "$GITHUB_ENV"
        working-directory: backend
      - name: Run contract tests
        run: deno task test:contract
        working-directory: backend/supabase
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
        working-directory: backend

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Matches the contract job; 2.116 verifies local ES256 tokens via JWKS.
          version: 2.116.0
      - run: npm ci
      - name: Start Supabase stack (trimmed)
        run: supabase start -x studio,imgproxy,logflare,vector
        working-directory: backend
      # Creates its own test users with a password generated for this run
      # against the ephemeral local stack — no stored credentials.
      - name: Authenticated E2E pass
        run: ./e2e/run.sh
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup
        working-directory: backend

  db-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17 # matches backend/supabase/config.toml major_version
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild schema from migrations and run security assertions
        run: ./backend/supabase/local/db-test.sh
        env:
          ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
